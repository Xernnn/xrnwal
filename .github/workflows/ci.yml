name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # One job on purpose, to keep runner minutes down.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests, debug build, lint
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --console=plain

      # The server steps run even when the app checks fail, since they don't depend on them.
      # On the oldest and newest Python a server may run on: how deep json.loads nests changed in
      # 3.14. Not the runner's own Python: Ubuntu's 3.12.3 answers a garbage request line with no
      # status line (fixed in later CPython), which test_an_unparseable_request_gets_an_answer catches.
      - uses: actions/setup-python@v7
        id: py312
        if: ${{ !cancelled() }}
        with:
          python-version: "3.12"

      - uses: actions/setup-python@v7
        id: py314
        if: ${{ !cancelled() }}
        with:
          python-version: "3.14"

      - name: Sync server and deploy tests, Python 3.12
        if: ${{ !cancelled() }}
        run: |
          py="${{ steps.py312.outputs.python-path }}"
          "$py" --version
          "$py" -m pip install --quiet bcrypt
          "$py" -m unittest server/test_xrnwal_sync.py server/test_deploy.py

      - name: Sync server and deploy tests, Python 3.14
        if: ${{ !cancelled() }}
        run: |
          py="${{ steps.py314.outputs.python-path }}"
          "$py" --version
          "$py" -m pip install --quiet bcrypt
          "$py" -m unittest server/test_xrnwal_sync.py server/test_deploy.py
